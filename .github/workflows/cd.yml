name: CD - Deploy, Verify and DAST

on:
  workflow_dispatch:
  # checkov:skip=CKV_GHA_7: manual deploy/scan workflow, not a build; its inputs pick the target and are passed to steps only through env and validated
    inputs:
      image:
        description: "Container image, for example ghcr.io/org/app:sha"
        required: true
        type: string
      namespace:
        description: "Kubernetes namespace"
        required: true
        default: dev
        type: string
      deployment:
        description: "Kubernetes Deployment name"
        required: true
        type: string
      container:
        description: "Container name inside the Deployment"
        required: true
        type: string
      target_url:
        description: "Authorized staging/test URL for ZAP"
        required: true
        type: string
      zap_scan:
        description: "ZAP mode"
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - full

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-deploy:
    name: Image Security Gate
    runs-on: ubuntu-latest
    permissions:
      packages: read # pull the image from GHCR to scan it
    steps:
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ inputs.image }}
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: 1

  deploy:
    name: Kubernetes Deployment
    needs: pre-deploy
    runs-on: ubuntu-latest
    permissions: {}
    environment: staging
    steps:
      - name: Install kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
      - name: Configure kubeconfig
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        run: |
          test -n "$KUBE_CONFIG" || { echo "KUBE_CONFIG secret is required"; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Validate inputs
        env:
          NAMESPACE: ${{ inputs.namespace }}
          DEPLOYMENT: ${{ inputs.deployment }}
          CONTAINER: ${{ inputs.container }}
          IMAGE: ${{ inputs.image }}
        run: |
          for v in "$NAMESPACE" "$DEPLOYMENT" "$CONTAINER"; do
            printf '%s' "$v" | grep -Eq '^[a-z0-9]([-a-z0-9.]{0,251}[a-z0-9])?$' || { echo "Not a valid Kubernetes name: $v"; exit 1; }
          done
          printf '%s' "$IMAGE" | grep -Eq '^[A-Za-z0-9][A-Za-z0-9._/:@-]{0,254}$' || { echo "Not a valid image reference: $IMAGE"; exit 1; }
      - name: Update deployment image
        env:
          NAMESPACE: ${{ inputs.namespace }}
          DEPLOYMENT: ${{ inputs.deployment }}
          CONTAINER: ${{ inputs.container }}
          IMAGE: ${{ inputs.image }}
        run: |
          kubectl -n "$NAMESPACE" set image "deployment/$DEPLOYMENT" "$CONTAINER=$IMAGE"
      - name: Wait for rollout
        env:
          NAMESPACE: ${{ inputs.namespace }}
          DEPLOYMENT: ${{ inputs.deployment }}
        run: |
          kubectl -n "$NAMESPACE" rollout status "deployment/$DEPLOYMENT" --timeout=5m

  dast:
    name: OWASP ZAP DAST
    needs: deploy
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Validate target
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          if ! printf '%s' "$TARGET_URL" | grep -Eq '^https?://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~%/?#=&+:-]*)?$'; then
            echo "Target must be an http:// or https:// URL"; exit 1
          fi
      - name: Wait for application
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          for i in {1..18}; do
            code=$(curl -k -L -s -o /dev/null -w '%{http_code}' --max-time 10 "$TARGET_URL" || true)
            if echo "$code" | grep -qE '^[2-4][0-9][0-9]$'; then
              echo "Application ready: HTTP $code"
              exit 0
            fi
            sleep 10
          done
          echo "Application did not become ready"
          exit 1
      - name: ZAP baseline
        if: inputs.zap_scan == 'baseline'
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          mkdir -p zap-report
          docker run --rm -v "$PWD/zap-report:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$TARGET_URL" -r zap-baseline.html
      - name: ZAP full scan
        if: inputs.zap_scan == 'full'
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          mkdir -p zap-report
          docker run --rm -v "$PWD/zap-report:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py -t "$TARGET_URL" -r zap-full.html
      - name: Upload DAST report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zap-dast-report
          path: zap-report/
          retention-days: 30
