name: IaC Security - Checkov
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
jobs:
  checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12
        with:
          directory: .
          framework: terraform,kubernetes,dockerfile,github_actions
          # CKV_GHA_7 (no workflow_dispatch inputs) is a provenance rule for build workflows. This repo's
          # dispatch workflows are manual deploys and scans whose inputs choose the target; they pass
          # inputs to steps only through env and validate them. GitHub ignores Checkov's in-file skip
          # comments, so the rule is skipped here.
          skip_check: CKV_GHA_7
          soft_fail: true
          output_format: sarif
          output_file_path: checkov.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: checkov.sarif