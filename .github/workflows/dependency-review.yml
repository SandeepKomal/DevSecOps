name: Dependency Review

on:
  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      base_ref:
        description: "Base branch"
        required: true
        default: "main"

      head_ref:
        description: "Head branch to review"
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          base-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.base_ref || github.event.pull_request.base.ref }}
          head-ref: ${{ github.event_name == 'workflow_dispatch' && inputs.head_ref || github.event.pull_request.head.ref }}
          fail-on-severity: high
