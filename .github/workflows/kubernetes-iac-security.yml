name: Kubernetes IaC Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  kubernetes-iac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # the scanners exit with an empty SARIF when there is nothing to scan, so check for manifests first
      - name: Look for Kubernetes manifests
        id: manifests
        run: |
          if grep -rlqE '^kind:' --include='*.yaml' --include='*.yml' --exclude-dir=.git --exclude-dir=.github .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Kubernetes manifests in this repository; skipping the scans."
          fi
      - name: Kubescape Kubernetes security scan
        if: steps.manifests.outputs.present == 'true'
        uses: kubescape/github-action@c9749b84d138c0cbbb702b258774954f5463b82e # v3.0.21
        continue-on-error: true
        with:
          files: .
          format: sarif
          outputFile: kubescape-results
          severityThreshold: high
      - name: Upload Kubescape SARIF
        if: always() && steps.manifests.outputs.present == 'true' && hashFiles('kubescape-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: kubescape-results.sarif
          category: kubescape-iac
      - name: kube-linter
        if: steps.manifests.outputs.present == 'true'
        uses: stackrox/kube-linter-action@v1
        with:
          directory: .
          format: sarif
          output-file: kube-linter-results.sarif
