name: Authorized DAST
on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Authorized staging/test URL only"
        required: true
        type: string
      scan:
        description: "ZAP scan mode"
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - full
permissions:
  contents: read
jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target
        run: |
          case "${{ inputs.target_url }}" in
            http://*|https://*) ;;
            *) echo "Target must start with http:// or https://"; exit 1 ;;
          esac
      - name: ZAP baseline
        if: inputs.scan == 'baseline'
        run: |
          mkdir -p zap-report
          docker run --rm -v "$PWD/zap-report:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "${{ inputs.target_url }}" -r zap-baseline.html
      - name: ZAP full scan
        if: inputs.scan == 'full'
        run: |
          mkdir -p zap-report
          docker run --rm -v "$PWD/zap-report:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py -t "${{ inputs.target_url }}" -r zap-full.html
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-dast-report
          path: zap-report/
          retention-days: 30