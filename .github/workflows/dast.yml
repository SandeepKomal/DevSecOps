name: Authorized DAST
on:
  workflow_dispatch:
  # checkov:skip=CKV_GHA_7: manual deploy/scan workflow, not a build; its inputs pick the target and are passed to steps only through env and validated
    inputs:
      target_url:
        description: "Authorized staging/test URL only"
        required: true
        type: string
      scan:
        description: "ZAP scan mode"
        required: true
        default: baseline
        type: choice
        options:
          - baseline
          - full
permissions:
  contents: read
jobs:
  zap:
    runs-on: ubuntu-latest
    steps:
      - name: Validate target
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          if ! printf '%s' "$TARGET_URL" | grep -Eq '^https?://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~%/?#=&+:-]*)?$'; then
            echo "Target must be an http:// or https:// URL"; exit 1
          fi
      - name: ZAP baseline
        if: inputs.scan == 'baseline'
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          mkdir -p zap-report
          docker run --rm -v "$PWD/zap-report:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "$TARGET_URL" -r zap-baseline.html
      - name: ZAP full scan
        if: inputs.scan == 'full'
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          mkdir -p zap-report
          docker run --rm -v "$PWD/zap-report:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-full-scan.py -t "$TARGET_URL" -r zap-full.html
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zap-dast-report
          path: zap-report/
          retention-days: 30