name: site-ci

on:
  push:
    branches: [main]
    paths: ["site/**", "tests/**", "scripts/**", ".github/workflows/site-ci.yml"]
  pull_request:
    paths: ["site/**", "tests/**", "scripts/**", ".github/workflows/site-ci.yml"]

permissions:
  contents: read # check out the code to run the tests

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Site tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Scripts parse
        run: for f in site/*.js scripts/*.js tests/*.js; do node --check "$f"; done

      - name: Site data, quiz, troubleshooting and page rules
        run: node tests/check_site_data.js

      - name: Playground scenarios (broken at start, wrong moves fail, fix works)
        run: node tests/check_playground.js

      - name: Pipeline X-ray
        run: node tests/check_xray.js

      - name: problems.html is up to date
        run: node tests/check_problems.js

      - name: Fuzz the simulator and the X-ray
        run: node tests/fuzz_playground.js 3000
