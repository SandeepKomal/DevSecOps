name: GitHub Advanced Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "11 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  codeql:
    name: GHAS Code Scanning - CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read         # check out the workflows
      security-events: write # upload CodeQL results to code scanning
    strategy:
      fail-fast: false
      matrix:
        # the repository is GitHub Actions workflows; it has no JavaScript, Python or Java source to analyze
        language: [actions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/ghas/${{ matrix.language }}"

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the dependency changes between base and head
    steps:
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  ghas-checklist:
    name: ghas-checklist
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: GHAS controls
        run: |
          echo "Code scanning: CodeQL"
          echo "Secret scanning: enable in repository Security settings"
          echo "Push protection: enable in repository Security settings"
          echo "Dependency graph and Dependabot alerts: enable in repository Security settings"
          echo "Dependency review: pull-request workflow"
