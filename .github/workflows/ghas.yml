name: GitHub Advanced Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "11 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: GHAS Code Scanning - CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # the repository is GitHub Actions workflows; it has no JavaScript, Python or Java source to analyze
        language: [actions]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: "/ghas/${{ matrix.language }}"

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high

  ghas-checklist:
    runs-on: ubuntu-latest
    steps:
      - name: GHAS controls
        run: |
          echo "Code scanning: CodeQL"
          echo "Secret scanning: enable in repository Security settings"
          echo "Push protection: enable in repository Security settings"
          echo "Dependency graph and Dependabot alerts: enable in repository Security settings"
          echo "Dependency review: pull-request workflow"
