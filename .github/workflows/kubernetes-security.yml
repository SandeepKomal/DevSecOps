name: Kubernetes Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kube-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run kube-linter
        uses: stackrox/kube-linter-action@v1
        with:
          directory: .
          format: sarif
          output-file: kube-linter-results.sarif
          report-all-errors: true
