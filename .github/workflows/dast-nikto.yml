name: Nikto Web DAST

on:
  workflow_dispatch:
  # checkov:skip=CKV_GHA_7: manual deploy/scan workflow, not a build; its inputs pick the target and are passed to steps only through env and validated
    inputs:
      target_url:
        description: "Authorized staging/test URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  nikto:
    runs-on: ubuntu-latest
    steps:
      - name: Run Nikto against authorized target
        env:
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          if ! printf '%s' "$TARGET_URL" | grep -Eq '^https?://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~%/?#=&+:-]*)?$'; then
            echo "Target must be an http:// or https:// URL"; exit 1
          fi
          docker run --rm -v "$PWD:/work" sullo/nikto:latest -h "$TARGET_URL" -output /work/nikto-report.html -Format htm

      - name: Upload Nikto report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nikto-dast-report
          path: nikto-report.html
          retention-days: 30
