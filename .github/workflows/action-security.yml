name: GitHub Actions Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zizmor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@v0.6.4
        with:
          persona: pedantic
