name: Container Security

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  container-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect Dockerfile
        id: dockerfile
        run: |
          if find . -maxdepth 4 -type f \( -name 'Dockerfile' -o -name 'Dockerfile.*' \) | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No Dockerfile found; container scan will be skipped."
          fi

      - name: Build test image
        if: steps.dockerfile.outputs.found == 'true'
        run: docker build -t devsecops-security-test:latest .

      - name: Trivy image scan
        if: steps.dockerfile.outputs.found == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: devsecops-security-test:latest
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: 1

      - name: Upload image SARIF
        if: always() && steps.dockerfile.outputs.found == 'true'
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: trivy-image.sarif
