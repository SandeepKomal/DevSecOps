name: AWS Cloud Security - Prowler

on:
  workflow_dispatch:
  # checkov:skip=CKV_GHA_7: manual deploy/scan workflow, not a build; its one boolean input only gates the job
    inputs:
      scan_account:
        description: "Run a Prowler AWS security assessment"
        required: true
        default: "true"
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  prowler:
    if: inputs.scan_account
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_SECURITY_ROLE_ARN }}

      # the action takes provider/output-formats/flags (it has no "args" input), runs Prowler in a container
      # that receives only the variables named in extra-env, and uploads output/ as the prowler-aws artifact
      - name: Run Prowler AWS assessment
        uses: prowler-cloud/prowler@bffc8844c1c9a3666e37a2ada4ee05f62e1446b0 # 5.45.0
        with:
          provider: aws
          output-formats: html csv json-ocsf
          flags: --compliance cis_5.0_aws
          extra-env: AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN AWS_REGION AWS_DEFAULT_REGION
