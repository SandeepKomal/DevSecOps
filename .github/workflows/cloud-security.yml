name: AWS Cloud Security - Prowler

on:
  workflow_dispatch:
  # checkov:skip=CKV_GHA_7: manual deploy/scan workflow, not a build; its one boolean input only gates the job
    inputs:
      scan_account:
        description: "Run a Prowler AWS security assessment"
        required: true
        default: "true"
        type: boolean

permissions:
  id-token: write
  contents: read

jobs:
  prowler:
    if: inputs.scan_account
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_SECURITY_ROLE_ARN }}

      - name: Run Prowler AWS assessment
        uses: toniblyx/prowler@69b80f6a3f7fac9324d5f6826391faf775fc3700 # master
        with:
          args: >-
            aws
            --compliance cis_5.0_0
            --output-formats html csv json-ocsf
            --output-directory prowler-output

      - name: Upload Prowler reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: prowler-aws-security-report
          path: prowler-output/
          retention-days: 30
