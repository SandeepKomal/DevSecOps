name: Terraform Security and Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    name: terraform
    permissions:
      contents: read # check out the code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Detect Terraform
        id: detect
        run: |
          if find . -name '*.tf' -not -path './.git/*' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Terraform
        if: steps.detect.outputs.found == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4

      - name: Terraform Format Check
        if: steps.detect.outputs.found == 'true'
        run: terraform fmt -check -recursive

      - name: Terraform Init
        if: steps.detect.outputs.found == 'true'
        run: terraform init -backend=false -input=false

      - name: Terraform Validate
        if: steps.detect.outputs.found == 'true'
        run: terraform validate

      - name: Checkov Terraform Scan
        if: steps.detect.outputs.found == 'true'
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12
        with:
          directory: .
          framework: terraform
          quiet: true
