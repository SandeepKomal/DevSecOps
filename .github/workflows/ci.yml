name: CI - Build and Security Gates

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the code
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install dependencies when requirements.txt exists
        run: |
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          fi
      # tests/ also holds the learning site's Node tests (run by site-ci.yml); pytest only runs Python tests
      - name: Run Python tests when they exist
        run: |
          if find tests -name 'test_*.py' -print -quit 2>/dev/null | grep -q .; then
            pytest -q
          else
            echo "No Python tests found; skipping pytest."
          fi

  security-gates:
    name: CI Security Gates
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the history gitleaks scans
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0  # gitleaks scans the pull request's commit range, which a one-commit checkout doesn't have
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: 1
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build Container
    needs: security-gates
    runs-on: ubuntu-latest
    permissions:
      contents: read         # check out the Dockerfile
      packages: write        # push the image to GHCR
      security-events: write # upload the container scan to code scanning
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # hashFiles() isn't available in a job-level if, so the Dockerfile check runs after checkout
      - name: Look for a Dockerfile
        id: dockerfile
        run: |
          if [ -n "$(find . -name Dockerfile -not -path './.git/*' -print -quit)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Dockerfile in this repository; skipping the container build."
          fi
      - name: Set image
        id: image
        if: steps.dockerfile.outputs.present == 'true'
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPO,,}:$SHA"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
      - name: Login to GHCR
        if: steps.dockerfile.outputs.present == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker build -t "$IMAGE" .
      - name: Trivy container scan
        if: steps.dockerfile.outputs.present == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}
          scanners: vuln,misconfig,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-container.sarif
          exit-code: 1
      - name: Upload Trivy SARIF
        if: always() && steps.dockerfile.outputs.present == 'true'
        uses: github/codeql-action/upload-sarif@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          sarif_file: trivy-container.sarif
      - name: Push image
        if: steps.dockerfile.outputs.present == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: docker push "$IMAGE"

  ci-summary:
    name: CI Summary
    if: always()
    needs: [test, security-gates, build]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          TESTS: ${{ needs.test.result }}
          GATES: ${{ needs.security-gates.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          echo "Tests: $TESTS"
          echo "Security gates: $GATES"
          echo "Container build: $BUILD"
