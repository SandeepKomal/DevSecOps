# Trivy secret scanning: allow the learning site's invented practice
# credentials (site/ playground and examples). Each contains PRACTICE and is
# not a real key; real secrets are still reported.
allow-rules:
  - id: practice-aws-keys
    description: Invented AWS access key IDs used by the playground scenarios
    regex: AKIAPRACTICE[A-Z2-7]{8}
  - id: practice-github-token
    description: Invented GitHub token used by the push protection scenario
    regex: ghp_PRACTICE[A-Za-z0-9]+
  - id: practice-values
    description: Invented passwords and tokens used by the playground scenarios
    regex: PRACTICE[-/][A-Za-z0-9/+=_-]+
